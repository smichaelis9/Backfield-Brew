<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backfield Brew – Archived Players</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css?v=11" />
  <script defer src="script.js?v=54"></script>

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  >
  
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon.png"
  >

  <link
    rel="apple-touch-icon"
    href="/favicon.png"
  >
  
</head>

<body>
  <header class="site-header">
    <img src="BFB-Logo.png" alt="Backfield Brew" class="site-logo" />
  </header>

  <div class="header-buttons">
    <a href="index.html">Home</a>
    <a href="rankings.html">Active Rankings</a>
    
  <div class="dropdown-nav">

    <button class="dropdown-button">
      Other Pages ▼
    </button>

    <div class="dropdown-content">
      <a href="depth.html">Organizational Depth Chart</a>
      <a href="stats.html">Organizational Stats</a>
      <a href="logs.html">Scouting Logs</a>
      <a href="transactions.html">Transactions</a>
      <a href="rule5.html">Rule 5 Eligibility</a>
      <a href="freeagency.html">MiLB Free Agency</a>
      <a href="draft.html">Draft History</a>
      <a href="international.html">International History</a>
    </div>

  </div>

</div>

  <main class="container">
    <section class="card">
      <div class="filter-grid">
        <input type="text" id="searchBox" placeholder="Search archived player..." />

        <select id="typeFilter">
          <option value="">All Types</option>
          <option value="hitter">Hitters</option>
          <option value="pitcher">Pitchers</option>
        </select>

        <select id="positionFilter"></select>
        <select id="levelFilter"></select>
      </div>
    </section>

    <section class="card">
      <div class="ranking-scroll">
        <table id="rankingTable">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>OFP</th>
              <th>Pos</th>
              <th>Height</th>
              <th>Weight</th>
              <th>Archive Reason</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <p id="status">Loading archived players...</p>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initArchivePage();
      handleHeaderButtons();
      setupMobileDropdown();
    });
  </script>
</body>
</html>
