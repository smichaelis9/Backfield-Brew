name: Update Minor League Standings

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date (YYYY-MM-DD)"
        required: false
        type: string

  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Standings
        env:
          DATE: ${{ inputs.date }}
        run: node scripts/build-standings.mjs

      - name: Commit updated standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/standings.json

          if git diff --cached --quiet; then
            echo "No standings changes."
            exit 0
          fi

          git commit -m "Update minor league standings"
          git pull --rebase
          git push
