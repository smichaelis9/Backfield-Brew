name: Update Yesterday on the Farm

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to process (YYYY-MM-DD)"
        required: false
        type: string

  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: write

jobs:
  update-yesterday-on-the-farm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Yesterday on the Farm
        env:
          DATE: ${{ inputs.date }}
        run: node scripts/build-yesterday-on-the-farm.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/yesterday-on-the-farm.json data/yotf/

          if git diff --cached --quiet; then
            echo "No Yesterday on the Farm changes."
            exit 0
          fi

          git commit -m "Update Yesterday on the Farm"
          git push
