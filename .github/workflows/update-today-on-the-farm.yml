name: Update Today on the Farm

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to process (YYYY-MM-DD)"
        required: false
        type: string

  schedule:
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: write

concurrency:
  group: today-on-the-farm
  cancel-in-progress: true

jobs:
  update-today-on-the-farm:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Today on the Farm
        env:
          DATE: ${{ inputs.date }}
        run: node scripts/build-today-on-the-farm.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/today-on-the-farm.json

          if git diff --cached --quiet; then
            echo "No Today on the Farm changes."
            exit 0
          fi

          git commit -m "Update Today on the Farm"
          git pull --rebase
          git push
